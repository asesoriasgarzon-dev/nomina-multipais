<!DOCTYPE html>
<html lang="{{ request._lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">{{ t('app_title') }}</a>
        <nav>
            <a href="{{ url_for('dashboard') }}">{{ t('dashboard') }}</a>
            <a href="{{ url_for('alertas_view') }}">{{ t('alertas_title') }}</a>
            <span class="lang-switch">
                {% for code, label in [('es','ES'), ('en','EN'), ('pt','PT'), ('zh','简体'), ('zh-hk','繁體')] %}
                    <a href="?lang={{ code }}" class="{{ 'active' if request._lang == code else '' }}">{{ idioma_flag(code) }} {{ label }}</a>
                {% endfor %}
            </span>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
