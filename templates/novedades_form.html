{% extends "base.html" %}
{% block content %}
<h1>{{ config.name }} — {{ t('novedades_title') }}</h1>
{% if ejemplo %}
<p><button type="button" class="btn-export" onclick="cargarDemo()">{{ t('cargar_ejemplo_demo') }}</button></p>
{% endif %}
<form method="post" class="form-grid">
    <input type="hidden" name="es_demo" id="es_demo" value="0">
    <label>{{ t('employee_name') }}
        <input type="text" name="nombre" id="f_nombre" required>
    </label>
    <label>{{ t('employee_id') }}
        <input type="text" name="identificacion" id="f_identificacion">
    </label>
    <label>{{ t('period') }}
        <input type="month" name="periodo" id="f_periodo" required>
    </label>
    <label>{{ t('salario_contrato') }} ({{ config.currency }})
        <input type="number" step="0.01" name="salario_contrato" id="f_salario_contrato" required>
    </label>
    {% for key, label_key, step, default in campos %}
    <label>{{ t(label_key) }}
        <input type="number" step="{{ step }}" name="{{ key }}" id="f_{{ key }}" value="{{ default }}">
    </label>
    {% endfor %}
    <button type="submit">{{ t('submit') }}</button>
</form>
<p><a href="{{ url_for('pais_home', pais=pais) }}">&larr; {{ t('back') }}</a></p>

{% if ejemplo %}
<script>
// Escenario DEMO de {{ config.name }}: datos ficticios de un empleado de
// ejemplo, no un caso real — pero se calculan con la fórmula real del país.
function cargarDemo() {
    var valores = {{ ejemplo|tojson }};
    for (var campo in valores) {
        var el = document.getElementById('f_' + campo);
        if (el) { el.value = valores[campo]; }
    }
    if (!document.getElementById('f_periodo').value) {
        var d = new Date();
        document.getElementById('f_periodo').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    document.getElementById('es_demo').value = '1';
}
</script>
{% endif %}
{% endblock %}
